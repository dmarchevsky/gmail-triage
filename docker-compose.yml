services:
  mailtriage:
    build: .
    image: mailtriage:latest
    # Loopback only: remote access goes through the cloudflared tunnel below.
    ports: ["127.0.0.1:8080:8080"]
    environment:
      - APP_SECRET_KEY=${APP_SECRET_KEY:?set in .env}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - CF_ACCESS_ISSUER=${CF_ACCESS_ISSUER:-}
      - CF_ACCESS_ALLOWED_EMAILS=${CF_ACCESS_ALLOWED_EMAILS:-}
      - DEV_AUTH=${DEV_AUTH:-false}
      - DATABASE_URL=postgresql+psycopg://mailtriage:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/mailtriage
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:8081/v1}
      - LLM_MODEL=${LLM_MODEL:-local}
      - TZ=${TZ:-America/Los_Angeles}
    volumes:
      - mailtriage-data:/data    # legacy SQLite (migration source / fallback)
    extra_hosts: ["host.docker.internal:host-gateway"]
    # Public resolvers so the Cloudflare Access key fetch doesn't depend on
    # Docker's resolv.conf being ready at boot.
    dns: [1.1.1.1, 8.8.8.8]
    read_only: true
    tmpfs: ["/tmp"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=mailtriage
      - POSTGRES_USER=mailtriage
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set in .env}
    volumes:
      - mailtriage-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailtriage -d mailtriage"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cloudflare Tunnel: publishes the UI at the hostname configured for this tunnel
  # in the Zero Trust dashboard (service: http://mailtriage:8080), behind a
  # Cloudflare Access application. Enabled with COMPOSE_PROFILES=tunnel in .env.
  cloudflared:
    image: cloudflare/cloudflared:2026.8.3
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}  # required when the tunnel profile is on
    depends_on: [mailtriage]
    restart: unless-stopped
    profiles: ["tunnel"]

#  llama-cpp:                        # OPTIONAL bundled CPU inference.
#    image: ghcr.io/ggml-org/llama.cpp:server
#    command: ["-m", "/models/model.gguf", "--port", "8081", "--host", "0.0.0.0", "-c", "8192"]
#    volumes: ["./models:/models:ro"]
#    restart: unless-stopped
#  # ...and set LLM_BASE_URL=http://llama-cpp:8081/v1 for the mailtriage service.

volumes:
  mailtriage-data:
  mailtriage-pg:
